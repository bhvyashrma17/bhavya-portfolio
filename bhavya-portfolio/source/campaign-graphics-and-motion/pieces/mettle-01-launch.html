<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../brand-mettle.css">
<style>
body{padding:0}
.top{position:absolute;left:0;right:0;top:0;height:22px}
.brandbar{position:absolute;left:72px;right:72px;top:74px;color:var(--chalk)}
.brandbar .ring{color:var(--brass)}
.brandbar .tag{color:var(--moss)}
.num{position:absolute;right:-30px;top:104px;font-family:var(--d);font-weight:900;font-size:1060px;line-height:1;letter-spacing:-.02em;
  background:
    repeating-linear-gradient(45deg,rgba(15,43,36,.34) 0 3px,transparent 3px 16px),
    repeating-linear-gradient(-45deg,rgba(15,43,36,.34) 0 3px,transparent 3px 16px),
    linear-gradient(180deg,var(--brass-2),var(--brass) 60%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.words{position:absolute;left:72px;top:206px;font-family:var(--d);font-weight:900;text-transform:uppercase;line-height:.8}
.words .w1{display:block;font-size:250px;color:var(--chalk)}
.words .w2{display:block;font-size:150px;color:var(--chalk);margin-top:394px}
.words .w3{display:block;font-size:150px;color:var(--brass-2);margin-top:6px}
.plan{position:absolute;left:72px;right:72px;bottom:178px}
.bar{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.bar i{display:block;height:20px;border-radius:3px;background:var(--forest-3)}
.bar i:nth-child(1){background:var(--brass)}
.bar i:nth-child(6){background:repeating-linear-gradient(45deg,var(--brass) 0 5px,var(--forest-3) 5px 10px)}
.lbl{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px;font-size:24px;font-weight:600;color:var(--moss)}
.lbl span:first-child{color:var(--brass-2)}
.lbl span:last-child{color:var(--chalk)}
.foot{position:absolute;left:72px;right:72px;bottom:68px;display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid rgba(236,237,232,.18);padding-top:26px}
.foot p{font-size:34px;font-weight:600}
.foot .cta{color:var(--brass-2)}
</style></head>
<body class="post dark">
<div class="top knurl"></div>
<header class="brandbar">
  <svg class="ring" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="2.6" fill="currentColor"/></svg>
  <span class="wm">METTLE</span>
  <span class="tag">Strength and conditioning club</span>
</header>
<div class="num">4</div>
<div class="words"><span class="w1">Block</span><span class="w2">Starts</span><span class="w3">Monday</span></div>
<div class="plan">
  <div class="bar"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="lbl"><span>Week 1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>Re-test</span></div>
</div>
<div class="foot"><p>Six weeks of coached strength</p><p class="cta">Book: link in bio</p></div>
</body></html>
