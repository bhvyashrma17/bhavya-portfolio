<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../brand-mettle.css">
<style>
/* story: keep text between y 270 and y 1650 */
.knurl.edge{position:absolute;left:0;right:0;height:26px}
.brandbar{position:absolute;left:84px;right:84px;top:300px;color:var(--chalk)}
.brandbar .ring{color:var(--brass)}
.brandbar .tag{color:var(--moss)}
h1{position:absolute;left:80px;right:80px;top:410px;font-family:var(--d);font-weight:900;text-transform:uppercase;line-height:.8}
h1 span{display:block}
h1 em{display:block;font-style:normal;color:var(--brass-2);margin-top:18px}
.timer{position:absolute;left:50%;top:850px;width:450px;height:450px;margin-left:-225px}
.timer svg{width:450px;height:450px;transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.timer .t b{font-family:var(--d);font-weight:900;font-size:176px;line-height:.8}
.timer .t span{font-size:36px;font-weight:600;color:var(--moss);margin-top:18px}
.first{position:absolute;left:84px;right:84px;top:1390px;display:flex;justify-content:space-between;align-items:end;gap:24px;border-top:2px solid rgba(236,237,232,.2);padding-top:26px}
.first p{font-size:34px;line-height:1.25;font-weight:600}
.first p small{display:block;font-size:28px;color:var(--moss);font-weight:600}
.spots{text-align:right;font-family:var(--d);font-weight:800;font-size:44px;line-height:1;color:var(--brass-2);white-space:nowrap}
.spots small{display:block;font-family:var(--b);font-size:26px;font-weight:600;color:var(--moss);margin-top:8px}
.cta{position:absolute;left:84px;right:84px;top:1556px;height:84px;border-radius:999px;background:var(--chalk);color:var(--forest);display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--d);font-weight:900;font-size:46px;text-transform:uppercase;letter-spacing:.02em}
.cta svg{width:40px;height:40px}
</style></head>
<body class="story dark">
<div class="knurl edge" style="top:0"></div>
<header class="brandbar">
  <svg class="ring" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="2.6" fill="currentColor"/></svg>
  <span class="wm">METTLE</span>
  <span class="tag">Sunday reminder</span>
</header>
<h1><span data-fit data-max="300">Block 4</span><em data-fit data-max="200">Starts tomorrow</em></h1>
<div class="timer">
  <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="#1E473B" stroke-width="9"/><circle cx="60" cy="60" r="52" fill="none" stroke="#C9A45C" stroke-width="9" stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="54.5"/></svg>
  <div class="t"><b>6:00</b><span>Monday, first class</span></div>
</div>
<div class="first"><p>Barbell Strength<small>with Arjun Rao, 75 minutes</small></p><p class="spots">3 of 8 left<small>at the 6:00 class</small></p></div>
<div class="cta">Book your spot
  <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 32L32 8M14 8h18v18" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="knurl edge" style="bottom:0"></div>
<script src="../fit.js"></script></body></html>
