<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../brand-mettle.css">
<style>
.top{position:absolute;left:0;right:0;top:0;height:22px}
.brandbar{position:absolute;left:72px;right:72px;top:74px;color:var(--forest)}
.brandbar .tag{font-family:var(--d);font-weight:800;font-size:40px;color:var(--iron-soft)}
h1{position:absolute;left:68px;right:72px;top:196px;font-family:var(--d);font-weight:900;line-height:.82;color:var(--forest);text-transform:uppercase}
h1 small{display:block;font-size:132px;color:var(--iron-soft);margin-bottom:10px}
h1 span{display:block;letter-spacing:-.005em}
.lede{position:absolute;left:72px;top:650px;font-size:42px;font-weight:600;line-height:1.2;color:var(--iron);max-width:860px}
.chart{position:absolute;left:72px;right:72px;bottom:214px;height:300px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-items:end;border-bottom:3px solid var(--forest)}
.col{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.col b{font-family:var(--d);font-weight:800;font-size:40px;line-height:1;color:var(--forest);margin-bottom:12px}
.col i{display:block;background:var(--forest);border-radius:4px 4px 0 0}
.col.test i{background:
  repeating-linear-gradient(45deg,rgba(15,43,36,.55) 0 3px,transparent 3px 12px),
  repeating-linear-gradient(-45deg,rgba(15,43,36,.55) 0 3px,transparent 3px 12px),var(--brass)}
.wk{position:absolute;left:72px;right:72px;bottom:164px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;font-size:26px;font-weight:600;color:var(--iron-soft)}
.swipe{position:absolute;left:72px;right:72px;bottom:64px;display:flex;align-items:center;justify-content:space-between;font-size:32px;font-weight:700;color:var(--forest)}
.swipe svg{width:120px;height:36px}
.key{font-size:26px;font-weight:600;color:var(--iron-soft)}
</style></head>
<body class="post light">
<div class="top knurl on-light"></div>
<header class="brandbar">
  <svg class="ring" viewBox="0 0 32 32" aria-hidden="true" style="color:var(--forest)"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="2.6" fill="currentColor"/></svg>
  <span class="wm">METTLE</span>
  <span class="tag">1/3</span>
</header>
<h1><small>What's in</small><span data-fit data-max="330">Block 4</span></h1>
<p class="lede">Four programmes, six weeks, one re-test. Effort climbs a little every week, set by RPE.</p>
<div class="chart">
  <div class="col"><b>RPE 6</b><i style="height:96px"></i></div>
  <div class="col"><b>7</b><i style="height:126px"></i></div>
  <div class="col"><b>7.5</b><i style="height:150px"></i></div>
  <div class="col"><b>8</b><i style="height:176px"></i></div>
  <div class="col"><b>8.5</b><i style="height:200px"></i></div>
  <div class="col test"><b>Test</b><i style="height:240px"></i></div>
</div>
<div class="wk"><span>Week 1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div>
<div class="swipe"><span class="key">RPE 8: two good reps left in the tank</span><span style="display:flex;align-items:center;gap:16px">Swipe for times<svg viewBox="0 0 120 36" aria-hidden="true"><path d="M2 18h110M96 4l16 14-16 14" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
<script src="../fit.js"></script></body></html>
