<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../brand-mettle.css">
<style>
body{width:1080px;height:1920px;background:var(--forest);color:var(--chalk);overflow:hidden;position:relative}
.top{position:absolute;left:0;right:0;top:0;height:26px}
.bot{position:absolute;left:0;right:0;bottom:0;height:26px}
.brandbar{position:absolute;left:80px;right:80px;top:250px}
.brandbar .tag{color:var(--moss);font-size:30px}
#block{position:absolute;left:72px;top:360px;font-family:var(--d);font-weight:900;font-size:300px;line-height:.82;letter-spacing:.01em}
#four{position:absolute;right:30px;top:340px;font-family:var(--d);font-weight:900;font-size:1000px;line-height:.82;
  background:repeating-linear-gradient(45deg,rgba(15,43,36,.45) 0 4px,transparent 4px 18px),repeating-linear-gradient(-45deg,rgba(15,43,36,.45) 0 4px,transparent 4px 18px),linear-gradient(180deg,var(--brass-2),var(--brass) 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#four-o{position:absolute;right:30px;top:340px;font-family:var(--d);font-weight:900;font-size:1000px;line-height:.82;color:transparent;-webkit-text-stroke:4px rgba(201,164,92,.5)}
#weeks{position:absolute;left:80px;right:80px;top:1210px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
#weeks div{height:30px;border-radius:6px;background:var(--forest-3)}
#weeks div.f{background:var(--brass)}
#weeks div.k{background:repeating-linear-gradient(45deg,rgba(15,43,36,.45) 0 3px,transparent 3px 12px),repeating-linear-gradient(-45deg,rgba(15,43,36,.45) 0 3px,transparent 3px 12px),var(--brass)}
#wl{position:absolute;left:80px;right:80px;top:1258px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;font-size:28px;font-weight:600;color:var(--moss)}
#starts{position:absolute;left:72px;top:1330px;font-family:var(--d);font-weight:900;font-size:170px;line-height:.86;text-transform:uppercase}
#starts span{display:block;color:var(--brass)}
#cta{position:absolute;left:80px;right:80px;top:1660px;height:96px;border-radius:999px;background:var(--chalk);color:var(--forest);display:grid;place-items:center;font-family:var(--d);font-weight:800;font-size:44px;letter-spacing:.04em;text-transform:uppercase}
</style></head><body>
<div class="top knurl" id="k1"></div><div class="bot knurl" id="k2"></div>
<header class="brandbar" id="bb"><svg class="ring" viewBox="0 0 32 32" style="color:var(--brass)"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="2.6" fill="currentColor"/></svg><span class="wm">METTLE</span><span class="tag">Six-week blocks</span></header>
<div id="four-o">4</div><div id="four">4</div>
<div id="block">BLOCK</div>
<div id="weeks"><div></div><div></div><div></div><div></div><div></div><div></div></div>
<div id="wl"><span>Wk 1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>Re-test</span></div>
<div id="starts">Starts<span>Monday</span></div>
<div id="cta">Book your spot: link in bio</div>
<script src="ease.js"></script>
<script>
const DUR = 8;
function render(t){
  const out = 1 - eIn(prog(t, 7.4, 8));
  set($('#k1'), { transform: 'translateX(' + lerp(-1080, 0, eOut(prog(t, 0, .6))) + 'px)', opacity: out });
  set($('#k2'), { transform: 'translateX(' + lerp(1080, 0, eOut(prog(t, 0, .6))) + 'px)', opacity: out });
  set($('#bb'), { opacity: prog(t, .2, .7) * out, transform: 'translateY(' + lerp(-30, 0, eOut(prog(t, .2, .7))) + 'px)' });
  const pb = eOut(prog(t, .3, 1.2));
  set($('#block'), { opacity: pb * out, transform: 'translateY(' + lerp(120, 0, pb) + 'px)', fontVariationSettings: '"wght" ' + Math.round(lerp(300, 900, pb)) });
  const p4 = eOut(prog(t, .9, 2.4));
  set($('#four-o'), { opacity: prog(t, .8, 1.2) * out, transform: 'scale(' + lerp(.86, 1, p4) + ')', transformOrigin: '80% 70%' });
  set($('#four'), { opacity: out, transform: 'scale(' + lerp(.86, 1, p4) + ')', transformOrigin: '80% 70%', clipPath: 'inset(' + lerp(100, 0, eIO(prog(t, 1.2, 2.6))) + '% 0 0 0)' });
  const wk = $$('#weeks div');
  wk.forEach((d, i) => { const a = 2.4 + i * .3; d.className = t >= a ? (i === 5 ? 'k' : 'f') : ''; set(d, { transform: 'scaleY(' + (t >= a ? lerp(1.6, 1, eOut(prog(t, a, a + .25))) : 1) + ')' }); });
  set($('#weeks'), { opacity: prog(t, 2.1, 2.4) * out });
  set($('#wl'), { opacity: prog(t, 2.2, 2.6) * out });
  const ps = eOut(prog(t, 4.4, 5.3));
  set($('#starts'), { opacity: ps * out, transform: 'translateX(' + lerp(-140, 0, ps) + 'px)' });
  const pc = eBack(prog(t, 5.4, 6.1));
  set($('#cta'), { opacity: prog(t, 5.4, 5.7) * out, transform: 'scale(' + lerp(.7, 1, pc) + ')' });
}
render(0);
</script></body></html>
